<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rtify — Player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header / Search Bar -->
    <header id="app-header">
        <div class="header-inner">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" stroke="url(#lg)" stroke-width="2"/><path d="M9.5 8.5v7l6-3.5-6-3.5z" fill="url(#lg)"/><defs><linearGradient id="lg" x1="0" y1="0" x2="24" y2="24"><stop stop-color="#1DB954"/><stop offset="1" stop-color="#1ed760"/></linearGradient></defs></svg>
                <span>Rtify</span>
            </div>
            <div class="search-wrapper">
                <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
                <input type="text" id="search-input" placeholder="Pesquisar músicas, artistas..." autocomplete="off">
                <div id="search-spinner" class="spinner hidden"></div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main id="main-content">
        <!-- Estado Inicial -->
        <div id="empty-state">
            <div class="empty-icon">🎧</div>
            <h2>O que você quer ouvir?</h2>
            <p>Pesquise por qualquer música ou artista acima</p>
        </div>

        <!-- Resultados -->
        <div id="results-container" class="hidden">
            <h3 id="results-title">Resultados</h3>
            <div id="results-list"></div>
        </div>
    </main>

    <!-- Player Fixo Inferior -->
    <footer id="player-bar" class="hidden">
        <div class="player-inner">
            <div class="player-track-info">
                <img id="player-cover" src="" alt="cover">
                <div class="player-text">
                    <span id="player-title" class="player-song-name">—</span>
                    <span id="player-artist" class="player-artist-name">—</span>
                </div>
            </div>
            <div class="player-controls">
                <button id="btn-prev" class="ctrl-btn" title="Anterior">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button id="btn-play" class="ctrl-btn play-btn" title="Play / Pause">
                    <svg id="icon-play" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="icon-pause" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" class="hidden"><path d="M6 19h4V5H6zm8-14v14h4V5z"/></svg>
                </button>
                <button id="btn-next" class="ctrl-btn" title="Próxima">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zm10-12v12h2V6z"/></svg>
                </button>
            </div>
            <div class="player-progress-wrapper">
                <span id="time-current">0:00</span>
                <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1">
                <span id="time-total">0:00</span>
            </div>
            <div class="player-volume">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                <input type="range" id="volume-bar" min="0" max="100" value="80" step="1">
            </div>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
